{% extends 'learning_logs/base.html' %} {% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <a
      href="{% url 'learning_logs:topic' topic.id %}"
      class="text-decoration-none text-muted small fw-semibold"
    >
      ← Back to {{ topic }}
    </a>

    <h1 class="display-5 fw-bold mt-2 mb-1">New Entry</h1>

    <p class="text-muted mb-0">
      Add a new learning note or update for this topic.
    </p>
  </div>
</div>

<div class="card border-0 shadow-sm rounded-4">
  <div class="card-body p-4">
    <form action="{% url 'learning_logs:new_entry' topic.id %}" method="post">
      {% csrf_token %} {{ form.as_div }}

      <div class="d-flex gap-2 mt-4">
        <button name="submit" class="btn btn-primary">Add Entry</button>

        <a
          href="{% url 'learning_logs:topic' topic.id %}"
          class="btn btn-outline-secondary"
        >
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>

{% endblock content %}
